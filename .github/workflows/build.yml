name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/lab2-cicd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Show Java version
        run: java -version

      - name: Show Maven Wrapper version
        run: ./mvnw --version

      - name: Run tests and verify
        run: ./mvnw -B --no-transfer-progress clean verify

  build:
    name: Build JAR
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Package JAR
        run: ./mvnw -B --no-transfer-progress package -DskipTests

      - name: Check JAR exists
        run: test -f target/lab2p2026.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lab2p2026-jar
          path: target/lab2p2026.jar
          if-no-files-found: error
          retention-days: 7
